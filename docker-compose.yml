services:
  postgres:
    image: postgres:16-alpine
    container_name: uhv_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uhv_portal_db}
      POSTGRES_USER: ${POSTGRES_USER:-uhv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uhv_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uhv_user} -d ${POSTGRES_DB:-uhv_portal_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uhv_internal

  redis:
    image: redis:7-alpine
    container_name: uhv_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uhv_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uhv_backend
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/data/uploads
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uhv_internal

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uhv_celery_worker
    restart: always
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=6", "-Q", "gdrive_uploads,email_notifications,maintenance"]
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_DIR=/data/uploads
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - uhv_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uhv_frontend
    restart: always
    networks:
      - uhv_internal

  nginx:
    image: nginx:alpine
    container_name: uhv_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - uhv_internal

volumes:
  postgres_data:
  redis_data:
  upload_storage:

networks:
  uhv_internal:
    driver: bridge
