# Rate limiting zone: 60 requests per second burstable
limit_req_zone $binary_remote_addr zone=uhv_req_limit:10m rate=60r/s;

upstream backend_cluster {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_server {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Maximum upload size for video presentations (500MB + margin)
    client_max_body_size 600M;
    client_body_buffer_size 16M;
    client_body_timeout 300s;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Backend API Routing
    location /api/ {
        limit_req zone=uhv_req_limit burst=100 nodelay;

        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for chunked uploads
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API Documentation (Swagger UI)
    location /docs {
        proxy_pass http://backend_cluster/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend_cluster/openapi.json;
        proxy_set_header Host $host;
    }

    # Frontend SPA Routing
    location / {
        proxy_pass http://frontend_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
